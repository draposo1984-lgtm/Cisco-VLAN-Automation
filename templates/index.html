<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Automação Cisco</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background: #f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:500px;
            background:#ffffff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 4px 15px rgba(0,0,0,0.15);
        }

        h1{
            text-align:center;
            color:#0056b3;
            margin-bottom:25px;
        }

        label{
            font-weight:bold;
            display:block;
            margin-top:10px;
            margin-bottom:5px;
        }

        input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#0056b3;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#003d80;
        }

        .resultado{
            margin-top:20px;
            padding:10px;
            background:#f8f9fa;
            border-left:4px solid #0056b3;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Automação Cisco</h1>

    <form method="POST">

        <label>IP do Switch</label>
        <input type="text" name="ip">

        <label>Usuário</label>
        <input type="text" name="username">

        <label>Senha</label>
        <input type="password" name="password">

        <label>Hostname</label>
        <input type="text"
               name="hostname"
               value="SWITCH_AUTOMATIZADO">

        <label>ID VLAN 1</label>
        <input type="number" name="vlan_id_1" required>

        <label>Nome VLAN 1</label>
        <input type="text" name="vlan_nome_1" required>

        <label>ID VLAN 2</label>
        <input type="number" name="vlan_id_2" required>

        <label>Nome VLAN 2</label>
        <input type="text" name="vlan_nome_2" required>

        <label>ID VLAN 3</label>
        <input type="number" name="vlan_id_3" required>

        <label>Nome VLAN 3</label>
        <input type="text" name="vlan_nome_3" required>

        <button type="submit">
            Aplicar Configuração
        </button>

    </form>

    <div class="resultado">
        <pre>{{ resultado }}</pre>
    </div>

</div>

</body>
</html>
